---
- name: Fetch Nextcloud PPA dists listing
  ansible.builtin.uri:
    url: "{{ nextcloud_client_ppaurl }}/dists"
    return_content: true
  check_mode: false
  register: ppa_listing

- name: Parse codename list from HTML
  ansible.builtin.set_fact:
    ppa_codenames: "{{ ppa_listing.content | regex_findall('\\b([a-z]+?)/</a>') | unique }}"

- name: Check if upstream-release file exists
  ansible.builtin.stat:
    path: /etc/upstream-release/lsb-release
  register: upstream_release_file

- name: Read upstream-release file if present
  ansible.builtin.slurp:
    path: /etc/upstream-release/lsb-release
  register: upstream_release_raw
  when: upstream_release_file.stat.exists

- name: Extract upstream codename
  ansible.builtin.set_fact:
    dist_codename: >-
      {{ (upstream_release_raw.content | b64decode |
          regex_search('^DISTRIB_CODENAME=.*', multiline=True) |
          regex_replace('^DISTRIB_CODENAME=', '')) | default(ansible_facts.distribution_release) }}
- name: Install nextcloud-client only on supported distros
  when: dist_codename in ppa_codenames
  block:
    - name: Ensure python3-debian is installed
      ansible.builtin.package:
        name: python3-debian
        state: present
      become: true

    - name: Check if Nextcloud PPA binary keyring exists
      ansible.builtin.stat:
        path: /etc/apt/keyrings/nextcloud-devs-ppa.gpg
      register: nextcloud_gpg_stat

    - name: Download Nextcloud PPA GPG key
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1FCD77DD0DBEF5699AD2610160EE47FBAD3DD469"
        dest: /etc/apt/keyrings/nextcloud-devs-ppa.asc
        mode: '0644'
      when: not nextcloud_gpg_stat.stat.exists
      become: true

    - name: Convert Nextcloud PPA GPG key to binary keyring
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/nextcloud-devs-ppa.gpg /etc/apt/keyrings/nextcloud-devs-ppa.asc
        creates: /etc/apt/keyrings/nextcloud-devs-ppa.gpg
      when: not nextcloud_gpg_stat.stat.exists
      become: true

    - name: Add Nextcloud apt repository
      ansible.builtin.deb822_repository:
        name: nextcloud-devs-ppa
        types: [deb, deb-src]
        uris: "{{ nextcloud_client_ppaurl }}"
        suites: ["{{ dist_codename }}"]
        components: [main]
        signed_by: /etc/apt/keyrings/nextcloud-devs-ppa.gpg
        state: present
        enabled: true
      become: true

    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Build list of nextcloud packages to install
      ansible.builtin.set_fact:
        nextcloud_packages: >-
          {{
            ['nextcloud-client'] +
            (['nautilus-nextcloud'] if 'nautilus' in ansible_facts.packages else []) +
            (['dolphin-nextcloud'] if 'dolphin' in ansible_facts.packages else []) +
            (['nemo-nextcloud'] if 'nemo' in ansible_facts.packages else []) +
            (['caja-nextcloud'] if 'caja' in ansible_facts.packages else [])
          }}

    - name: Install nextcloud client and extensions
      ansible.builtin.apt:
        name: "{{ nextcloud_packages }}"
        state: present
        update_cache: true
      ignore_errors: "{{ ansible_check_mode }}"
      become: true
